<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#333"/>
    </marker>
    <style>
      .panel { fill:#fafafa; stroke:#999; stroke-width:2; }
      .person { fill:#fff; stroke:#555; stroke-width:2; }
      .actor { fill:#ddd; stroke:#111; stroke-width:4; }
      .dead { fill:#eee; stroke:#aaa; stroke-width:2; }
      .label { font: 18px sans-serif; text-anchor:middle; dominant-baseline:middle; fill:#222; }
      .dead-label { font: 18px sans-serif; text-anchor:middle; dominant-baseline:middle; fill:#999; }
      .title { font: bold 22px sans-serif; fill:#222; }
      .note { font: 17px sans-serif; fill:#444; }
      .arrow { stroke:#333; stroke-width:3; fill:none; marker-end:url(#arrow); }
      .cross { stroke:#777; stroke-width:3; }
    </style>
  </defs>

  <rect width="1200" height="800" fill="#fff"/>
  <text x="600" y="35" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#222">範例一：火把熄滅過程</text>
  <text x="600" y="65" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#555">灰底粗框＝行動者　×＝火把已熄滅　箭頭＝本回合熄滅目標</text>

  <!-- Round 1 -->
  <g transform="translate(35 90)">
    <rect class="panel" width="550" height="325" rx="10"/>
    <text class="title" x="20" y="32">回合 1：第 1 人（第 2 隊）→ 第 3 人（第 1 隊）</text>
    <circle cx="275" cy="185" r="35" fill="#eee" stroke="#aaa"/><text class="label" x="275" y="185">營火</text>
    <path class="arrow" d="M275 91 Q390 120 420 205"/>
    <circle class="actor" cx="275" cy="90" r="31"/><text class="label" x="275" y="90">1｜隊2</text>
    <circle class="person" cx="415" cy="125" r="31"/><text class="label" x="415" y="125">2｜隊2</text>
    <circle class="dead" cx="415" cy="245" r="31"/><text class="dead-label" x="415" y="245">3｜隊1</text><path class="cross" d="M393 223 L437 267 M437 223 L393 267"/>
    <circle class="person" cx="275" cy="285" r="31"/><text class="label" x="275" y="285">4｜隊3</text>
    <circle class="person" cx="135" cy="245" r="31"/><text class="label" x="135" y="245">5｜隊1</text>
    <circle class="person" cx="135" cy="125" r="31"/><text class="label" x="135" y="125">6｜隊2</text>
  </g>

  <!-- Round 2 -->
  <g transform="translate(615 90)">
    <rect class="panel" width="550" height="325" rx="10"/>
    <text class="title" x="20" y="32">回合 2：第 2 人（第 2 隊）→ 第 4 人（第 3 隊）</text>
    <circle cx="275" cy="185" r="35" fill="#eee" stroke="#aaa"/><text class="label" x="275" y="185">營火</text>
    <path class="arrow" d="M393 146 Q350 230 295 260"/>
    <circle class="person" cx="275" cy="90" r="31"/><text class="label" x="275" y="90">1｜隊2</text>
    <circle class="actor" cx="415" cy="125" r="31"/><text class="label" x="415" y="125">2｜隊2</text>
    <circle class="dead" cx="415" cy="245" r="31"/><text class="dead-label" x="415" y="245">3｜隊1</text><path class="cross" d="M393 223 L437 267 M437 223 L393 267"/>
    <circle class="dead" cx="275" cy="285" r="31"/><text class="dead-label" x="275" y="285">4｜隊3</text><path class="cross" d="M253 263 L297 307 M297 263 L253 307"/>
    <circle class="person" cx="135" cy="245" r="31"/><text class="label" x="135" y="245">5｜隊1</text>
    <circle class="person" cx="135" cy="125" r="31"/><text class="label" x="135" y="125">6｜隊2</text>
  </g>

  <!-- Round 3 -->
  <g transform="translate(35 445)">
    <rect class="panel" width="550" height="325" rx="10"/>
    <text class="title" x="20" y="32">回合 3：第 5 人（第 1 隊）→ 第 6 人（第 2 隊）</text>
    <circle cx="275" cy="185" r="35" fill="#eee" stroke="#aaa"/><text class="label" x="275" y="185">營火</text>
    <path class="arrow" d="M135 210 L135 160"/>
    <circle class="person" cx="275" cy="90" r="31"/><text class="label" x="275" y="90">1｜隊2</text>
    <circle class="person" cx="415" cy="125" r="31"/><text class="label" x="415" y="125">2｜隊2</text>
    <circle class="dead" cx="415" cy="245" r="31"/><text class="dead-label" x="415" y="245">3｜隊1</text><path class="cross" d="M393 223 L437 267 M437 223 L393 267"/>
    <circle class="dead" cx="275" cy="285" r="31"/><text class="dead-label" x="275" y="285">4｜隊3</text><path class="cross" d="M253 263 L297 307 M297 263 L253 307"/>
    <circle class="actor" cx="135" cy="245" r="31"/><text class="label" x="135" y="245">5｜隊1</text>
    <circle class="dead" cx="135" cy="125" r="31"/><text class="dead-label" x="135" y="125">6｜隊2</text><path class="cross" d="M113 103 L157 147 M157 103 L113 147"/>
  </g>

  <!-- Round 4 -->
  <g transform="translate(615 445)">
    <rect class="panel" width="550" height="325" rx="10"/>
    <text class="title" x="20" y="32">回合 4：第 1 人（第 2 隊）→ 第 5 人（第 1 隊）</text>
    <circle cx="275" cy="185" r="35" fill="#eee" stroke="#aaa"/><text class="label" x="275" y="185">營火</text>
    <path class="arrow" d="M250 105 Q150 130 135 210"/>
    <circle class="actor" cx="275" cy="90" r="31"/><text class="label" x="275" y="90">1｜隊2</text>
    <circle class="person" cx="415" cy="125" r="31"/><text class="label" x="415" y="125">2｜隊2</text>
    <circle class="dead" cx="415" cy="245" r="31"/><text class="dead-label" x="415" y="245">3｜隊1</text><path class="cross" d="M393 223 L437 267 M437 223 L393 267"/>
    <circle class="dead" cx="275" cy="285" r="31"/><text class="dead-label" x="275" y="285">4｜隊3</text><path class="cross" d="M253 263 L297 307 M297 263 L253 307"/>
    <circle class="dead" cx="135" cy="245" r="31"/><text class="dead-label" x="135" y="245">5｜隊1</text><path class="cross" d="M113 223 L157 267 M157 223 L113 267"/>
    <circle class="dead" cx="135" cy="125" r="31"/><text class="dead-label" x="135" y="125">6｜隊2</text><path class="cross" d="M113 103 L157 147 M157 103 L113 147"/>
    <text class="note" x="360" y="295">剩下第 1、2 人（第 2 隊）</text>
  </g>
</svg>
